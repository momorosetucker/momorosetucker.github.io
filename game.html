<body>
    <div id="target" onclick="caught()" style="position: absolute; font-size: 60px; cursor:pointer">🍓</div>
    <p id="score">Strawberries caught: 0</p>
    <script>
        let score = 0

        function move() {
            const t = document.getElementById('target')
            const maxX = window.innerWidth - t.offsetWidth
            const maxY = window.innerHeight - t.offsetHeight
            t.style.left = Math.random() * maxX + 'px'
            t.style.top = Math.random() * maxY + 'px'
        }

        function caught() {
            score += 1
            document.getElementById('score').textContent = 'Strawberries caught: ' + score
            move()
        }

        setInterval(move, 1500)
    </script>
 </body>
